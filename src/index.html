<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihongo Keyboard</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <div id="app" class="mode-bubble">

    <!-- 1. BUBBLE VIEW (Idle State) -->
    <div id="bubble-view" title="Nihongo Keyboard (Klik atau Alt+J)">
      <div class="drag-handle" title="Tahan & geser untuk memindahkan">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="5" r="2.5"/>
          <circle cx="19" cy="5" r="2.5"/>
          <circle cx="5" cy="12" r="2.5"/>
          <circle cx="19" cy="12" r="2.5"/>
          <circle cx="5" cy="19" r="2.5"/>
          <circle cx="19" cy="19" r="2.5"/>
        </svg>
      </div>
      <button id="btn-open-bubble" class="bubble-btn" aria-label="Buka Nihongo Keyboard">
        <span class="bubble-kanji">日</span>
        <span class="bubble-sub">語</span>
      </button>
      <div class="bubble-pulse"></div>
    </div>

    <!-- 2. EXPANDED VIEW (Input & Conversion State) -->
    <div id="expanded-view">
      <!-- Header bar (Draggable) -->
      <header class="window-header">
        <div class="header-title">
          <span class="header-icon">日</span>
          <span class="header-text" id="lbl-app-title">Nihongo Keyboard</span>
          <span class="shortcut-tag" id="lbl-shortcut-tag">Alt + J</span>
        </div>
        <div class="header-actions">
          <button id="btn-settings" class="icon-btn" title="Pengaturan">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button id="btn-minimize" class="icon-btn" title="Kecilkan ke bubble (Esc)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <button id="btn-close" class="icon-btn icon-btn-close" title="Tutup aplikasi">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- Main Input & Conversion Content -->
      <div id="main-content" class="content-panel">
        
        <!-- Mode Switcher Tabs (Romaji vs Translate) -->
        <div class="mode-tabs">
          <button type="button" class="mode-tab active" id="tab-mode-romaji" data-mode="romaji">
            <span id="lbl-tab-romaji">🔤 Romaji Mode</span>
          </button>
          <button type="button" class="mode-tab" id="tab-mode-translate" data-mode="translate">
            <span id="lbl-tab-translate">🌐 Terjemahan (ID/EN)</span>
          </button>
        </div>

        <div class="input-section">
          <div class="input-wrapper">
            <input 
              type="text" 
              id="romaji-input" 
              placeholder="Ketik romaji (contoh: kamu, arigatou, nihon)..." 
              autocomplete="off" 
              spellcheck="false"
            />
            <button id="btn-clear" class="btn-clear" title="Hapus teks">✕</button>
          </div>
        </div>

        <div class="results-grid">
          <!-- Hiragana Card -->
          <div class="result-card" id="card-hiragana" data-target="hiragana" title="Klik atau tekan Enter untuk salin">
            <div class="card-header">
              <span class="card-tag" id="lbl-tag-hiragana">HIRAGANA</span>
              <span class="key-hint" id="lbl-hint-hiragana">Enter ↵</span>
            </div>
            <div class="card-body">
              <span class="result-text" id="text-hiragana">-</span>
            </div>
          </div>

          <!-- Katakana Card -->
          <div class="result-card" id="card-katakana" data-target="katakana" title="Klik atau tekan Shift+Enter untuk salin">
            <div class="card-header">
              <span class="card-tag" id="lbl-tag-katakana">KATAKANA</span>
              <span class="key-hint" id="lbl-hint-katakana">Shift+Enter ⇧↵</span>
            </div>
            <div class="card-body">
              <span class="result-text" id="text-katakana">-</span>
            </div>
          </div>
        </div>

        <!-- Meaning / Dictionary Card -->
        <div class="meaning-card" id="card-meaning">
          <div class="meaning-header">
            <div class="meaning-title-wrap">
              <span class="meaning-icon">📖</span>
              <span class="meaning-tag" id="lbl-tag-meaning">ARTI / MAKNA</span>
            </div>
            <span class="jlpt-tag" id="lbl-meaning-badge" style="display: none;">JLPT</span>
          </div>
          <div class="meaning-body">
            <div class="meaning-kanji-wrap" id="wrap-meaning-kanji" style="display: none;" title="Klik untuk salin Kanji">
              <span class="meaning-kanji" id="text-meaning-kanji">-</span>
              <span class="kanji-copy-hint" id="lbl-kanji-hint">klik salin</span>
            </div>
            <div class="meaning-text" id="text-meaning-def">Ketik kata Jepang untuk melihat arti...</div>
          </div>
        </div>

        <!-- Status Tip -->
        <div class="status-bar">
          <span class="status-tip" id="lbl-status-tip">💡 <strong>Enter</strong> = Hiragana | <strong>Shift+Enter</strong> = Katakana | <strong>Ctrl+T</strong> = Ganti Mode</span>
        </div>
      </div>

      <!-- 3. SETTINGS PANEL (Overlay inside Expanded View) -->
      <div id="settings-panel" class="settings-panel settings-hidden">
        <div class="settings-header">
          <span class="settings-title" id="lbl-settings-title">Pengaturan</span>
          <button id="btn-close-settings" class="icon-btn" title="Tutup Pengaturan">✕</button>
        </div>

        <div class="settings-body">
          <div class="setting-item">
            <label class="setting-label" for="select-lang" id="lbl-setting-lang">Bahasa Tampilan</label>
            <div class="lang-pills">
              <button type="button" class="lang-pill active" data-lang="id" id="pill-lang-id">🇮🇩 Indonesia</button>
              <button type="button" class="lang-pill" data-lang="en" id="pill-lang-en">🇬🇧 English</button>
            </div>
          </div>

          <div class="setting-item">
            <label class="setting-label" for="select-shortcut" id="lbl-setting-shortcut">Shortcut Global</label>
            <select id="select-shortcut" class="setting-select">
              <option value="Alt+J">Alt + J (Default)</option>
              <option value="CommandOrControl+Shift+Space">Ctrl + Shift + Space</option>
              <option value="Alt+K">Alt + K</option>
              <option value="Alt+Space">Alt + Space</option>
            </select>
          </div>
        </div>

        <div class="settings-footer">
          <button id="btn-cancel-settings" class="btn-action btn-secondary" id="lbl-btn-cancel">Batal</button>
          <button id="btn-save-settings" class="btn-action btn-primary" id="lbl-btn-save">Simpan</button>
        </div>
      </div>

      <!-- Toast Feedback -->
      <div id="toast-message" class="toast-hidden">✓ Tersalin ke Clipboard!</div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="scripts/wanakana.min.js"></script>
  <script src="scripts/i18n.js"></script>
  <script src="scripts/dictionary.js"></script>
  <script src="scripts/converter.js"></script>
  <script src="scripts/renderer.js"></script>
</body>
</html>
